<div class="dashboard">
  <div class="filter-card">
    <div class="filter-tabs">
      <button
        class="filter-tab"
        aria-label="See buy listings"
        [class.filter-tab--active]="mode() === 'buy'"
        (click)="onModeChange('buy')"
      >
        <span>Buy</span>
      </button>
      <button
        class="filter-tab"
        aria-label="See rent listings"
        [class.filter-tab--active]="mode() === 'rent'"
        (click)="onModeChange('rent')"
      >
        <span>Rent</span>
      </button>
      @if (isAdmin()) {
        <button mat-icon-button (click)="onCreateNewListing()" aria-label="Create new listing">
          <mat-icon>add</mat-icon>
        </button>
      }
    </div>
    <app-filters-panel [filterOptions]="filterOptions()" [mode]="mode()" />
  </div>

  <app-listings-table
    [listings]="activeListings"
    [total]="total()"
    [loading]="listingsLoading()"
    [mode]="mode()"
  />
</div>
